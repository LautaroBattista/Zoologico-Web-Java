<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Habitats - Zoologico Temaiken</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <h1>Habitats del Zoologico</h1>

    <a th:href="@{/admin/inicio}">Volver al inicio</a>
    <a th:href="@{/admin/habitats/nuevo}">Agregar Habitat</a>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Clima</th>
                <th>Vegetacion</th>
                <th>Continentes</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="habitat : ${habitats}">
                <td th:text="${habitat.nombre}"></td>
                <td th:text="${habitat.clima}"></td>
                <td th:text="${habitat.vegetacion}"></td>
                <td>
                    <span th:each="continente, iter : ${habitat.continentes}">
                        <span th:text="${continente}"></span>
                        <span th:if="${!iter.last}">, </span>
                    </span>
                </td>
                <td>
                    <a th:href="@{/admin/habitats/editar/{id}(id=${habitat.id})}">Editar</a>
                    <form th:action="@{/admin/habitats/eliminar/{id}(id=${habitat.id})}" method="post">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${error}" style="color:red">
        <p th:text="${error}"></p>
    </div>
</body>
</html>
